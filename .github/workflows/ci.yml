---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned GNU reference
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison build-essential curl ed libio-pty-perl shellcheck xz-utils

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Build GNU patch 2.8 reference
        env:
          REFERENCE_PREFIX: ${{ runner.temp }}/gnu-patch-2.8
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/patch-2.8"
          ./configure --prefix="$REFERENCE_PREFIX"
          make --jobs=2
          make install
          "$REFERENCE_PREFIX/bin/patch" --version

      - name: Run GNU patch reference baseline
        env:
          REFERENCE_PATCH: ${{ runner.temp }}/gnu-patch-2.8/bin/patch
        run: perl tools/test.pl --patch "$REFERENCE_PATCH"

      - name: Run Camel patch against GNU suite
        run: perl tools/test.pl

      - name: Run differential compatibility cases
        env:
          REFERENCE_PATCH: ${{ runner.temp }}/gnu-patch-2.8/bin/patch
        run: perl tools/differential.pl --reference "$REFERENCE_PATCH"

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run focused regressions
        run: |
          sh tests/ownership-fallback.sh
          sh tests/runner-timeout.sh
          sh tests/version-output.sh
